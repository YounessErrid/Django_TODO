version: '3.7'

services:
  django_gunicorn:
    volumes:
      - static:/static  # Mount static files to /static
    env_file:
      - .env
    build:
      context: .
    ports:
      - "8000:8000"
    expose:
      - "8000"  # Expose the internal port for Nginx to communicate with Gunicorn

  nginx:
    build: ./nginx
    volumes:
      - static:/static  # Mount static files to /static
    ports:
      - "80:80"
    depends_on:
      - django_gunicorn

volumes:
  static:
